# 放入宝塔 Go 站点的 extension/classmatehub_go/ 目录。
# 保留宝塔生成的后端代理，仅为当前 Vue 路由和公开资源设置静态访问。
location = / {
    root /www/wwwroot/classmatehub;
    try_files /index.html =404;
    add_header Cache-Control "no-cache";
}

location ~ ^/(login|classes|students|statistics|profile|index\.html)/?$ {
    root /www/wwwroot/classmatehub;
    try_files /index.html =404;
    add_header Cache-Control "no-cache";
}

location ^~ /assets/ {
    root /www/wwwroot/classmatehub;
    try_files $uri =404;
}

location = /favicon.png {
    root /www/wwwroot/classmatehub;
    try_files $uri =404;
}

location = /favicon.ico {
    root /www/wwwroot/classmatehub;
    try_files $uri =404;
}
